<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Card World — Visual Demo</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#070609;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}*{box-sizing:border-box}#viewport{position:fixed;inset:0;background:#08070a;cursor:crosshair;overflow:hidden}#world{display:block;width:100%;height:100%;touch-action:none}#entry{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:rgba(6,5,8,.58);backdrop-filter:blur(3px)}#entry.hidden{display:none}#card{display:flex;flex-direction:column;align-items:center;gap:10px;padding:18px 22px;border:1px solid rgba(255,255,255,.17);border-radius:14px;background:rgba(9,8,11,.9)}#enter{min-width:190px;min-height:52px;border:1px solid rgba(255,207,89,.8);border-radius:10px;background:rgba(255,207,89,.09);color:#f4ead9;font:800 15px/1 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;letter-spacing:.08em;cursor:pointer}#status{color:rgba(244,234,217,.68);font-size:11px;letter-spacing:.08em}.crosshair{position:fixed;left:50%;top:50%;width:14px;height:14px;transform:translate(-50%,-50%);z-index:9;pointer-events:none;opacity:.72}.crosshair:before,.crosshair:after{content:"";position:absolute;background:#f4ead9}.crosshair:before{left:6px;top:1px;width:2px;height:12px}.crosshair:after{left:1px;top:6px;width:12px;height:2px}#fullscreen{position:fixed;right:14px;top:14px;z-index:11;width:40px;height:40px;border:1px solid rgba(255,255,255,.18);border-radius:9px;background:rgba(7,6,9,.56);color:#f4ead9;font-size:21px;cursor:pointer}#modeHud,#toast,#perf{display:none}
</style>
</head>
<body>
<div id="viewport" tabindex="0"><canvas id="world"></canvas></div>
<div class="crosshair"></div>
<div id="entry"><div id="card"><button id="enter" type="button">CLICK TO ENTER</button><small id="status">ESC TO LEAVE</small></div></div>
<button id="fullscreen" type="button" title="Fullscreen">⛶</button>
<div id="modeHud"></div><div id="toast"></div><div id="perf"></div>
<script>
(()=>{
 const canvas=document.getElementById('world'),entry=document.getElementById('entry'),enter=document.getElementById('enter'),status=document.getElementById('status'),viewport=document.getElementById('viewport');
 const input=window.CARD_WORLD_INPUT={entered:false,locked:false,mouseForward:false,mouseReverse:false,lookDX:0,lookDY:0};
 const clear=()=>{input.mouseForward=input.mouseReverse=false;input.lookDX=input.lookDY=0};
 const show=(msg='ESC TO LEAVE')=>{input.entered=input.locked=false;clear();entry.classList.remove('hidden');status.textContent=msg};
 const hide=()=>{entry.classList.add('hidden');viewport.focus()};
 enter.addEventListener('click',()=>{status.textContent='CAPTURING MOUSE…';try{const p=canvas.requestPointerLock();if(p?.catch)p.catch(()=>show('MOUSE CAPTURE BLOCKED — TRY AGAIN'))}catch(e){show('MOUSE CAPTURE BLOCKED — TRY AGAIN')}});
 document.addEventListener('pointerlockchange',()=>{const on=document.pointerLockElement===canvas;input.locked=on;input.entered=on;clear();on?hide():show()});
 document.addEventListener('pointerlockerror',()=>show('MOUSE CAPTURE BLOCKED — TRY AGAIN'));
 viewport.addEventListener('mousedown',e=>{if(!input.locked)return;if(e.button===0)input.mouseForward=true;if(e.button===2)input.mouseReverse=true;e.preventDefault()});
 window.addEventListener('mouseup',e=>{if(e.button===0)input.mouseForward=false;if(e.button===2)input.mouseReverse=false});
 viewport.addEventListener('contextmenu',e=>e.preventDefault());
 document.addEventListener('mousemove',e=>{if(!input.locked)return;input.lookDX+=Math.max(-60,Math.min(60,e.movementX||0));input.lookDY+=Math.max(-60,Math.min(60,e.movementY||0))});
 window.addEventListener('blur',clear);
})();
</script>
<script type="module">
try{
 const [a,b]=await Promise.all([fetch('./app-a.txt').then(r=>{if(!r.ok)throw Error('A');return r.text()}),fetch('./app-b.txt').then(r=>{if(!r.ok)throw Error('B');return r.text()})]);
 const tileSign=`function signTexture(text,fg='#ff3f97',bg='rgba(8,8,10,.92)',vertical=false){
  const cw=vertical?10:28, ch=vertical?28:10;
  return canvasTexture(cw,ch,(g,w,h)=>{
    g.fillStyle=bg;g.fillRect(0,0,w,h);
    g.fillStyle=fg;
    const blocks=vertical
      ? [[3,2,4,3],[3,8,4,3],[3,14,4,3],[3,20,4,3]]
      : [[2,3,4,4],[8,3,4,4],[14,3,4,4],[20,3,4,4]];
    for(const [x,y,bw,bh] of blocks)g.fillRect(x,y,bw,bh);
    g.globalAlpha=.20;g.fillStyle='#fff';
    if(vertical){g.fillRect(4,2,1,19)}else{g.fillRect(2,4,19,1)}
    g.globalAlpha=1;
  });
}
function neonSign`;
 const cleanA=a.replace(/function signTexture\(text,[\s\S]*?\n}\nfunction neonSign/,tileSign);
 const url=URL.createObjectURL(new Blob([cleanA,b],{type:'text/javascript'}));
 await import(url);
 URL.revokeObjectURL(url);
}catch(err){document.getElementById('status').textContent='DEMO FAILED TO LOAD — REFRESH';console.error(err)}
</script>
</body>
</html>
